name: Diagnose live site

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Render live site and test nav click
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright'
          const b = await chromium.launch()
          const p = await b.newPage()
          const errors = []
          p.on('pageerror', e => errors.push('PAGEERROR: ' + String(e).slice(0,200)))
          await p.goto('https://erkuldeepkushwah.github.io/Codellio/', { waitUntil: 'load' })
          await p.waitForTimeout(3500)
          const info = await p.evaluate(() => {
            const ul = document.querySelector('#menu-main-menu')
            return {
              title: document.title,
              menuItems: ul ? Array.from(ul.querySelectorAll('a')).map(a => a.textContent) : 'MISSING',
              menuUlHtml: ul ? ul.outerHTML.slice(0,180) : 'MISSING',
              pageTextHead: (document.body.innerText||'').replace(/\s+/g,' ').slice(0,80),
            }
          })
          console.log('=== BEFORE CLICK ===')
          console.log(JSON.stringify(info, null, 2))
          await p.evaluate(() => { window.__spaAlive = 'yes' })
          await p.click('#menu-main-menu a:has-text("About us")')
          await p.waitForTimeout(3000)
          const after = await p.evaluate(() => ({
            path: location.pathname,
            title: document.title,
            spaMarker: window.__spaAlive,
            pageTextHead: (document.body.innerText||'').replace(/\s+/g,' ').slice(0,90),
          }))
          console.log('=== AFTER CLICK (About us) ===')
          console.log(JSON.stringify(after, null, 2))
          console.log('=== PAGE ERRORS (' + errors.length + ') ===')
          for (const e of errors.slice(0,6)) console.log(e)
          await b.close()
          EOF
          node check.mjs
