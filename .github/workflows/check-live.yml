name: Check live site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live index and report
        run: |
          code=$(curl -s -o live.html -w "%{http_code}" "https://erkuldeepkushwah.github.io/Codellio/")
          echo "ROOT http=${code} bytes=$(wc -c < live.html)"
          echo "has_root_div=$(grep -c 'id=\"root\"' live.html || true)"
          echo "has_assets=$(grep -c '/Codellio/assets/' live.html || true)"
          echo "BuyNow=$(grep -c 'Buy now' live.html || true) templates700=$(grep -c '700+' live.html || true) be_demo=$(grep -c 'be-demo' live.html || true)"
          echo "script_refs:"
          grep -o 'src="[^"]*"' live.html | head
          echo DONE
